
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Global | Bubbles</title>
    <link rel="stylesheet" th:href="@{/css/ranking.css}">
</head>

<body>

    <header>

        <h1>
            <img src="/icons/bolhas.svg"
                 alt=""
                 style="width: 38px; height: 38px; vertical-align: middle;">
            Bubbles
        </h1>

        <span>
            <img src="/icons/trofeu.svg"
                 alt=""
                 style="width: 28px; height: 28px; vertical-align: middle;">
            Ranking Global
        </span>

    </header>

    <main>

        <h2>Classificação dos jogadores</h2>

        <p class="descricao">
            Confira quem está no topo do Bubbles!
        </p>

        <table>

            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Jogador</th>
                    <th>Rating</th>
                    <th>Liga</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="jogador, status : ${jogadores}">

                    <td class="posicao"
                        th:text="${status.count} + 'º'">
                    </td>

                    <td th:text="${jogador.nickname}"></td>

                    <td th:text="${#numbers.formatDecimal(jogador.rating, 1, 1)}"></td>

                    <td>
                        <span class="liga"
                              th:text="${ligaService.calcularLiga(jogador.rating)}">
                        </span>
                    </td>

                </tr>

            </tbody>

        </table>

        <div class="vazio" th:if="${#lists.isEmpty(jogadores)}">
            Ainda não existem jogadores no ranking.
        </div>

        <a href="/inicio" class="voltar">
            Voltar ao início
        </a>

    </main>

</body>
</html>
