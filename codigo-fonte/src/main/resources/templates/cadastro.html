
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Bubbles</title>
    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>

<body>

    <main class="container">

        <h1>
            <img src="/icons/bolhas.svg"
                 alt=""
                 style="width: 42px; height: 42px; vertical-align: middle;">
            Bubbles
        </h1>

        <p>Crie sua conta e entre na diversão!</p>

        <div class="mensagem"
             th:if="${erro}"
             th:text="${erro}">
        </div>

        <form action="/cadastro" method="post">

            <input
                type="text"
                name="nickname"
                placeholder="Seu nickname"
                maxlength="30"
                required>

            <input
                type="email"
                name="email"
                placeholder="Seu e-mail (opcional)">

            <input
                type="password"
                name="senha"
                placeholder="Sua senha (mínimo 8 caracteres)"
                minlength="8"
                required>

            <button type="submit">Criar minha conta</button>

        </form>

        <p>
            Já tem uma conta?
            <a href="/login">Fazer login</a>
        </p>

    </main>

</body>
</html>
