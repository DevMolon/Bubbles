
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 650"
     width="500"
     height="650">

    <defs>
        <linearGradient id="tronco" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#81502e"/>
            <stop offset="35%" stop-color="#bd8750"/>
            <stop offset="70%" stop-color="#a66c3e"/>
            <stop offset="100%" stop-color="#704329"/>
        </linearGradient>

        <linearGradient id="folha" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#83c879"/>
            <stop offset="100%" stop-color="#286d45"/>
        </linearGradient>

        <linearGradient id="folha2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a1d985"/>
            <stop offset="100%" stop-color="#397b4c"/>
        </linearGradient>
    </defs>

    <!-- TRONCO -->
    <path d="M245 650
             C250 510 225 370 245 230
             C252 190 260 160 260 145"
          fill="none"
          stroke="url(#tronco)"
          stroke-width="38"
          stroke-linecap="round"/>

    <!-- ANÉIS DO TRONCO -->
    <g fill="none" stroke="#70452d" stroke-width="4" opacity=".6">
        <path d="M228 590 Q247 600 265 589"/>
        <path d="M226 545 Q246 555 265 543"/>
        <path d="M225 500 Q245 510 264 498"/>
        <path d="M225 455 Q245 465 263 453"/>
        <path d="M227 410 Q245 420 260 408"/>
        <path d="M230 365 Q246 375 258 363"/>
        <path d="M235 320 Q248 330 255 318"/>
    </g>

    <!-- FOLHAS ANIMADAS -->
    <g transform="translate(255 155)">

        <!-- Folha esquerda -->
        <g>
            <animateTransform
                attributeName="transform"
                type="rotate"
                values="-7; -12; -7"
                dur="4.5s"
                repeatCount="indefinite"/>

            <path d="M0 0 Q-85 -105 -220 -95"
                  fill="none"
                  stroke="#397b4c"
                  stroke-width="8"
                  stroke-linecap="round"/>

            <path d="M-5 -5
                     Q-65 -65 -220 -95
                     Q-190 -65 -170 -42
                     Q-150 -68 -130 -52
                     Q-110 -79 -90 -60
                     Q-65 -87 -45 -68
                     Q-20 -91 -5 -5Z"
                  fill="url(#folha)"/>
        </g>

        <!-- Folha superior esquerda -->
        <g>
            <animateTransform
                attributeName="transform"
                type="rotate"
                values="0; -6; 0"
                dur="5s"
                repeatCount="indefinite"/>

            <path d="M0 0 Q-60 -145 -130 -190"
                  fill="none"
                  stroke="#397b4c"
                  stroke-width="8"/>

            <path d="M-5 -5
                     Q-55 -95 -130 -190
                     Q-130 -155 -110 -140
                     Q-140 -130 -120 -110
                     Q-145 -95 -115 -75
                     Q-135 -55 -90 -42
                     Q-105 -20 -5 -5Z"
                  fill="url(#folha2)"/>
        </g>

        <!-- Folha central -->
        <g>
            <animateTransform
                attributeName="transform"
                type="rotate"
                values="0; 5; 0"
                dur="4s"
                repeatCount="indefinite"/>

            <path d="M0 0 Q5 -130 0 -230"
                  fill="none"
                  stroke="#397b4c"
                  stroke-width="9"/>

            <path d="M0 -5
                     Q-45 -90 0 -230
                     Q15 -195 12 -170
                     Q40 -150 25 -125
                     Q55 -105 35 -80
                     Q65 -55 0 -5Z"
                  fill="url(#folha)"/>
        </g>

        <!-- Folha direita -->
        <g>
            <animateTransform
                attributeName="transform"
                type="rotate"
                values="0; 8; 0"
                dur="4.8s"
                repeatCount="indefinite"/>

            <path d="M0 0 Q95 -100 215 -85"
                  fill="none"
                  stroke="#397b4c"
                  stroke-width="8"/>

            <path d="M0 -5
                     Q80 -90 215 -85
                     Q190 -55 165 -50
                     Q160 -20 130 -32
                     Q110 -5 85 -20
                     Q55 5 35 -8Z"
                  fill="url(#folha2)"/>
        </g>

        <!-- Folha inferior direita -->
        <g>
            <animateTransform
                attributeName="transform"
                type="rotate"
                values="0; 10; 0"
                dur="5.2s"
                repeatCount="indefinite"/>

            <path d="M0 0 Q115 -35 190 30"
                  fill="none"
                  stroke="#397b4c"
                  stroke-width="8"/>

            <path d="M0 -5
                     Q100 -55 190 30
                     Q155 20 145 0
                     Q120 25 100 5
                     Q75 30 55 10
                     Q35 35 20 10Z"
                  fill="url(#folha)"/>
        </g>

    </g>
</svg>
